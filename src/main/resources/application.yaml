spring:
  application:
    name: hackerton

  # 1. 데이터베이스 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA 설정 (Hibernate)
  jpa:
    hibernate:
      ddl-auto: update # 테이블 자동 업데이트 (데이터 유지)
    show-sql: false
    open-in-view: false      # OSIV 비활성화
    properties:
      hibernate:
        format_sql: true     # SQL 예쁘게 출력